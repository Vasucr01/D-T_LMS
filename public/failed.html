<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Unsuccessful | DT Careers</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="/images/logo.png" type="image/png">
</head>
<body>

  <header class="header">
    <div class="header-container">
      <a href="/" class="brand-logo">
        <img src="/images/logo.png" alt="D&T Career Planners LLP Logo" class="brand-logo-img">
      </a>
    </div>
  </header>

  <main class="main-container">
    <div class="status-card">

      <div class="status-icon-wrap failed">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </div>

      <h1 class="status-title">Payment Unsuccessful</h1>
      <p class="status-subtitle">Your transaction could not be processed and your registration has not been confirmed.</p>

      <div class="countdown-box" style="background-color: #FFF5F5; border-color: #FEE2E2; color: var(--color-error);">
        <strong>Reason:</strong> <span id="failureReasonText">Payment was declined or cancelled.</span>
      </div>

      <a href="/form" class="btn-primary" style="background: linear-gradient(135deg, var(--color-navy) 0%, var(--color-royal) 100%);">
        Try Again
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/></svg>
      </a>

    </div>
  </main>

  <footer class="footer">
    <div class="footer-bottom" style="border: none; padding-top: 0; align-items: center;">
      <p>© 2026 D&T Career Planners LLP. All Rights Reserved.</p>
      <div class="powered-by-box">
        <span class="powered-by-text">Powered by</span>
        <img src="/images/gyanteerth-logo.png" alt="Gyanteerth Logo" class="powered-by-logo-img">
      </div>
    </div>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const reason = urlParams.get('reason');
      if (reason) {
        document.getElementById('failureReasonText').textContent = reason;
      }
    });
  </script>
</body>
</html>
